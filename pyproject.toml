[project]
name = "weldfinder"
version = "0.1.0"
description = "Detect candidate weld curves between sheet-metal solids in a STEP file and push one into CATIA V5"
requires-python = ">=3.10"
dependencies = [
    "cadquery-ocp>=7.7",
    "numpy",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest"]
exe = ["pyinstaller"]

[project.scripts]
weldfinder = "weldfinder.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
